<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =====================================================
         META
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login administrator Analisis Pola Pikir."
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <title>
        Login Admin - Analisis Pola Pikir
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<main class="container admin-container">


    <!-- =====================================================
         LOGIN PAGE
    ===================================================== -->

    <section class="page admin-login-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="page-header">

            <span class="admin-label">
                ADMINISTRATOR
            </span>

            <h1>
                Login Admin
            </h1>

            <p>
                Masuk untuk mengakses dashboard dan
                rekapan hasil analisis pola pikir.
            </p>

        </div>



        <!-- =================================================
             FORM LOGIN
        ================================================== -->

        <form
            id="loginForm"
            autocomplete="on"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- =================================================
                 PESAN ERROR
            ================================================== -->

            <p
                id="loginError"
                class="login-error hidden"
                role="alert"
                aria-live="polite"
            >
                Username atau password salah.
            </p>



            <!-- =================================================
                 LOGIN BUTTON
            ================================================== -->

            <button
                type="submit"
                class="primary-btn"
            >
                Login
            </button>


        </form>



        <!-- =================================================
             KEMBALI
        ================================================== -->

        <button
            id="kembaliBtn"
            type="button"
            class="secondary-btn"
        >
            Kembali ke Halaman Utama
        </button>


    </section>


</main>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="admin.js"
></script>


</body>

</html>
